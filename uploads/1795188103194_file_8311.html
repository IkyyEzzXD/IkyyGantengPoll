<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INFO BOT GACHA • TOKYO</title>
  <style>
    /* RESET & BASE */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url('https://ganga--link--ghhzdp9sv8hk.code.run/i/kubckq9m19');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      /* fallback gelap jika gambar gagal load */
      background-color: #0b0f1a;
      position: relative;
      padding: 1.5rem;
    }

    /* OVERLAY GELAP biar teks & tombol terbaca jelas */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);  /* lapisan gelap transparan */
      pointer-events: none;              /* agar tidak menghalangi klik */
      z-index: 1;
    }

    /* CONTAINER UTAMA */
    .info-container {
      position: relative;
      z-index: 10;
      max-width: 700px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 2.2rem;
      padding: 1rem;
    }

    /* CARD / BLOK UNTUK SETIAP BOT */
    .bot-card {
      background: rgba(20, 25, 35, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 36px;
      padding: 2rem 2rem 2.2rem;
      text-align: center;
      box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(255, 200, 50, 0.15);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .bot-card:hover {
      transform: scale(1.01);
      box-shadow: 0 30px 50px -8px #000, 0 0 0 3px rgba(255, 220, 100, 0.4);
    }

    /* JUDUL BOT */
    .bot-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff4d6;
      text-shadow: 0 0 12px #f0b000, 0 0 30px #ffae00, 0 4px 8px black;
      margin-bottom: 1.8rem;
      line-height: 1.2;
      word-break: break-word;
    }

    /* Tombol */
    .btn-telegram {
      display: inline-block;
      background: linear-gradient(145deg, #2a2f3a, #1a1e26);
      color: #fff3cf;
      font-size: 1.4rem;
      font-weight: 700;
      padding: 1rem 2.5rem;
      border-radius: 60px;
      text-decoration: none;
      letter-spacing: 1px;
      border: 2px solid #ffd966;
      box-shadow: 0 10px 0 #0a0c10, 0 12px 25px rgba(0, 0, 0, 0.7), 0 0 20px #ffc10755;
      transition: all 0.1s ease;
      text-transform: uppercase;
      width: fit-content;
      margin: 0 auto;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-telegram:hover {
      background: linear-gradient(145deg, #3a404d, #222730);
      border-color: #ffe484;
      box-shadow: 0 6px 0 #0a0c10, 0 15px 30px black, 0 0 30px #ffd966;
      transform: translateY(4px);
      color: #fff9e6;
    }

    .btn-telegram:active {
      transform: translateY(10px);
      box-shadow: 0 2px 0 #0a0c10, 0 10px 20px black;
    }

    /* ikon telegram (opsional) */
    .btn-telegram::before {
      content: "✈️";
      font-size: 1.6rem;
      filter: drop-shadow(0 2px 4px black);
    }

    /* Responsif */
    @media (max-width: 550px) {
      body {
        padding: 1rem;
      }

      .bot-card {
        padding: 1.5rem 1rem 1.8rem;
        border-radius: 28px;
      }

      .bot-title {
        font-size: 1.6rem;
        letter-spacing: 1px;
      }

      .btn-telegram {
        font-size: 1.1rem;
        padding: 0.8rem 1.8rem;
      }

      .btn-telegram::before {
        font-size: 1.3rem;
      }
    }

    @media (max-width: 380px) {
      .bot-title {
        font-size: 1.3rem;
      }

      .btn-telegram {
        font-size: 1rem;
        padding: 0.7rem 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="info-container">

    <!-- BOT 1: BOT NUMBER BOT -->
    <div class="bot-card">
      <h1 class="bot-title">BOT NUMBER BOT</h1>
      <a href="https://t.me/databasenumtokyobot" 
         class="btn-telegram" 
         target="_blank" 
         rel="noopener noreferrer">
        @databasenumtokyobot
      </a>
    </div>

    <!-- BOT 2: BOT FIX MERAH -->
    <div class="bot-card">
      <h1 class="bot-title">BOT FIX MERAH</h1>
      <a href="https://t.me/Tokyofixredapp" 
         class="btn-telegram" 
         target="_blank" 
         rel="noopener noreferrer">
        @Tokyofixredapp
      </a>
    </div>

  </div>
</body>
</html>
